run:
  name: live-grok-cli-smoke
  seed: 2026072704
  ticks: 1
  checkpoint_interval: 1
  retention: metrics_only
  scale: 1
  tags: [m1, live-provider-smoke, grok-cli]
clock: {profile: chronicle, ticks_per_sim_day: 1, days_per_sim_year: 360}
population: {initial_agents: 1}
world: {width: 20, height: 20, districts: 1, places_per_district: 4}
llm:
  est_tokens_per_call: 3300
  providers:
    reasoning:
      kind: grok_cli
      max_concurrency: 1
      calls_per_window: 5
      call_window_seconds: 18000
      quota_scope: grok-cli-polis-smoke
      timeout_s: 120
      structured_output: schema
      billing: free
      extra: {max_output_bytes: 2097152, use_default_model: true}
  budget:
    lines:
      cognition: {calls_per_tick: 1, tokens_per_tick: 50000}
      ancillary: {calls_per_tick: 1, tokens_per_tick: 50000}
      external: {calls_per_tick: 0, tokens_per_tick: 0}
      free: {calls_per_tick: 1, tokens_per_tick: 50000}
    usd_per_run: 0
    usd_halt_multiple: 1
    max_calls_per_run: 1
    on_exhaustion: halt
  routing:
    DELIBERATE: {lane: reasoning, model: grok-4.5-build, temperature: 0, max_tokens: 128, structured: constrain, template: deliberate/user.v1.jinja}
    REFLECT: {lane: reasoning, model: grok-4.5-build, temperature: 0, max_tokens: 128, structured: constrain, template: reflect/questions.v1.jinja}
    CREDIT_EVAL: {lane: reasoning, model: grok-4.5-build, temperature: 0, max_tokens: 128, structured: constrain, template: credit/eval.v1.jinja}
    IMPORTANCE: {lane: reasoning, model: grok-4.5-build, temperature: 0, max_tokens: 64, structured: constrain, template: importance/user.v1.jinja}
    EMBED: {lane: reasoning, model: grok-4.5-build, temperature: 0, max_tokens: 64, structured: constrain, template: embedding/user.v1.jinja}
  fallback_policy: strict
  cache: {mode: live, path: file://./.cache/live-grok-cli-smoke}
salience: {policy: always, deliberate_share: 1}
memory: {}
mechanisms: {}
society: {}
ablations: {}
store:
  dsn: postgresql://polis_engine:polis@127.0.0.1:5432/polis
  reader_dsn: postgresql://polis_reader:polis_reader@127.0.0.1:5432/polis
  redis_url: redis://127.0.0.1:6379/0
  blob_url: file://./.blobs
telemetry: {}
observatory: {enabled: false, bind: 127.0.0.1:8080}
