run:
  name: m2-smoke-50
  seed: 20260726
  ticks: 100
  checkpoint_interval: 50
  retention: full
  scale: 50
clock:
  profile: chronicle
  ticks_per_sim_day: 1
  days_per_sim_year: 360
  demographic_acceleration: 1.0
population:
  initial_agents: 50
world:
  width: 40
  height: 40
  districts: 4
  places_per_district: 8
llm:
  est_tokens_per_call: 3300
  providers:
    stub:
      kind: stub
      max_concurrency: 64
      billing: free
  budget:
    lines:
      cognition: {calls_per_tick: 10, tokens_per_tick: 33000}
      ancillary: {calls_per_tick: 4, tokens_per_tick: 13200}
      external: {calls_per_tick: 1, tokens_per_tick: 3300}
      free: {calls_per_tick: 64, tokens_per_tick: 211200}
    usd_per_run: 0
    usd_halt_multiple: 1.2
    on_exhaustion: degrade_to_reflex
  routing:
    DELIBERATE: {lane: stub, model: stub-v1, template: deliberate/user.v1.jinja}
    REFLECT: {lane: stub, model: stub-v1, template: reflect/questions.v1.jinja}
    CREDIT_EVAL: {lane: stub, model: stub-v1, temperature: 0.2, max_tokens: 400, template: credit/eval.v1.jinja}
    IMPORTANCE: {lane: stub, model: stub-v1, template: importance/user.v1.jinja}
    EMBED: {lane: stub, model: stub-v1, template: embedding/user.v1.jinja}
  cache:
    mode: live
    path: file://./.cache/completions
salience:
  policy: weighted
  deliberate_share: 0.07
  cognition_sample_rate: 0.02
memory: {}
mechanisms:
  labour_matching: stochastic_skill_match
  labour_vacancy_autopost: "on"
  skill_decay: "on"
  price_setting: markup_over_cost
  credit_scoring: linear_scorecard
  credit_supply: endogenous
society: {}
economy:
  enabled: true
ablations:
  reflex_only: true
store:
  dsn: postgresql://polis_engine:polis@127.0.0.1:5432/polis
  reader_dsn: postgresql://polis_reader:polis_reader@127.0.0.1:5432/polis
  redis_url: redis://127.0.0.1:6379/0
  blob_url: file://./.blobs
telemetry: {}
observatory:
  enabled: true
  bind: 127.0.0.1:8080
