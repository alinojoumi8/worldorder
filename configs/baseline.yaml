    reasoning:
      kind: minimax
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      max_concurrency: 8
      timeout_s: 30.0
      structured_output: none
      billing: token
    volume_text:
      kind: ollama
      base_url: https://ollama.com/v1
      api_key_env: OLLAMA_API_KEY
      max_concurrency: 8
      structured_output: json_mode
      billing: token
    volume_embed:
      kind: ollama
      base_url: https://ollama.com/v1
      api_key_env: OLLAMA_API_KEY
      max_concurrency: 8
      structured_output: json_mode
      billing: token
    stub:
      kind: stub
      max_concurrency: 32
      billing: free
  budget:
    lines:
      cognition: {calls_per_tick: 90, tokens_per_tick: 300000}
      ancillary: {calls_per_tick: 24, tokens_per_tick: 79200}
      external: {calls_per_tick: 32, tokens_per_tick: 105600}
      free: {calls_per_tick: 512, tokens_per_tick: 1689600}
    usd_per_run: 60.0
    usd_halt_multiple: 1.2
    on_exhaustion: degrade_to_reflex
  routing:
    DELIBERATE: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.8, template: deliberate/user.v1.jinja}
    REFLECT: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.9, template: reflect/questions.v1.jinja}
    CREDIT_EVAL: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.2, max_tokens: 400, template: credit/eval.v1.jinja}
    JUDGE: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.2, max_tokens: 700, structured: constrain, schema: prompts/schemas/judge.schema.json, template: judge/user.v1.jinja}
    IMPORTANCE: {lane: volume_text, model: qwen3.5:cloud, temperature: 0.0, template: importance/user.v1.jinja}
    NEWS_WRITE: {lane: volume_text, model: qwen3.5:cloud, temperature: 0.2, max_tokens: 800, structured: constrain, schema: prompts/schemas/news_write.schema.json, template: news_write/user.v1.jinja}
    EMBED: {lane: volume_embed, model: embeddinggemma:cloud, temperature: 0.0, template: embedding/user.v1.jinja}
  fallback_policy: permissive
  cache:
    mode: hybrid
    path: file://./.cache/completions
