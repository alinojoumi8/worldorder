run:
  name: baseline-1k
  seed: 20260724
  ticks: 43200
  checkpoint_interval: 500
  retention: full
  scale: 1000
clock:
  profile: microscope
  ticks_per_sim_day: 24
  days_per_sim_year: 360
  demographic_acceleration: 4.0
population:
  initial_agents: 1000
  age_distribution: pyramid_ca_2020
  trait_model: big_five_plus_econ
world:
  width: 200
  height: 200
  districts: 6
  places_per_district: 60
llm:
  est_tokens_per_call: 3300
  providers:
    reasoning:
      kind: minimax
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      max_concurrency: 8
      structured_output: none
      billing: token
    volume_text:
      kind: ollama
      base_url: https://ollama.com/v1
      api_key_env: OLLAMA_API_KEY
      max_concurrency: 8
      structured_output: json_mode
      billing: token
    volume_embed:
      kind: ollama
      base_url: https://ollama.com/v1
      api_key_env: OLLAMA_API_KEY
      max_concurrency: 8
      structured_output: json_mode
      billing: token
    stub:
      kind: stub
      max_concurrency: 32
      billing: free
  budget:
    lines:
      cognition: {calls_per_tick: 90, tokens_per_tick: 300000}
      ancillary: {calls_per_tick: 24, tokens_per_tick: 79200}
      external: {calls_per_tick: 32, tokens_per_tick: 105600}
      free: {calls_per_tick: 512, tokens_per_tick: 1689600}
    usd_per_run: 60.0
    usd_halt_multiple: 1.2
    on_exhaustion: degrade_to_reflex
  routing:
    DELIBERATE: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.8, template: deliberate/user.v1.jinja}
    REFLECT: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.9, template: reflect/questions.v1.jinja}
    CREDIT_EVAL: {lane: reasoning, model: MiniMax-M2.7, temperature: 0.2, max_tokens: 400, template: credit/eval.v1.jinja}
    IMPORTANCE: {lane: volume_text, model: qwen3.5:cloud, temperature: 0.0, template: importance/user.v1.jinja}
    NEWS_WRITE: {lane: volume_text, model: qwen3.5:cloud, temperature: 0.2, max_tokens: 800, structured: constrain, schema: prompts/schemas/news_write.schema.json, template: news_write/user.v1.jinja}
    EMBED: {lane: volume_embed, model: embeddinggemma:cloud, temperature: 0.0, template: embedding/user.v1.jinja}
  fallback_policy: permissive
  cache:
    mode: hybrid
    path: file://./.cache/completions
salience:
  policy: weighted
  deliberate_share: 0.07
  exploration_epsilon: 0.02
  cognition_sample_rate: 0.02
memory:
  write_threshold: 0.25
  max_per_agent: 3000
  retrieval_k: 12
  retrieval_max_tokens: 600
  reflection_threshold: 4.0
  reflection_min_gap_ticks: 24
mechanisms:
  party_platform_drift: member_mean
  fiscal_scoring: static
society:
  feed_algorithm: engagement
  outlets: 4
  outlet_slant_dispersion: 0.55
  cpm_cents: 40
  news_cycle: daily
  stories_per_reporter_per_cycle: 1
  claim_tolerance: 0.10
  misinfo_audit_rate: 0.05
  source_window_sim_days: 14
  line_threshold: 0.25
  correction_reach_multiplier: 0.6
  subscription_price_cents: 0
  reach_norm: 500
  newsworthiness_weights: {mag: 0.25, prom: 0.20, nov: 0.15, conf: 0.20, prox: 0.10, slant: 0.10}
  distribution_weights: {trust: 0.35, topic: 0.25, prox: 0.15, sub: 0.15, reach: 0.10}
beliefs:
  alpha: {experience: 0.35, social: 0.10, media: 0.08}
  theta_backfire: 0.60
  theta_entrench: 0.60
  theta_trust: 0.40
  beta_backfire: 0.05
  delta_entrench: 0.03
  eta_trust: 0.04
  gamma_c: 0.02
  max_belief_updates_per_call: 5
  max_step: 0.35
  genesis: {mixture_separation: 0.0, sd: 0.25}
  heritability_beliefs: 0.40
  confidence_dilution: 0.5
  sigma_belief: 0.08
  consensus_floor: 0.02
polity:
  election_method: plurality
  offices:
    president: {seats: 1, term_sim_years: 4, term_limit: 2, salary_cents: 900000}
    council: {seats: 7, term_sim_years: 2, method: proportional, salary_cents: 450000}
    judge: {seats: 2, term_sim_years: 6, salary_cents: 700000, min_skill_law: 0.6}
    police_chief: {seats: 1, salary_cents: 600000}
    cb_governor: {seats: 1, term_sim_years: 6, salary_cents: 800000}
  council_session: weekly
  policy_review: weekly
  court_session: twice_weekly
  campaign_length_sim_days: 30
  candidacy_close_sim_days: 7
  candidacy_deposit_cents: 250000
  deposit_refund_share: 0.05
  candidacy_record_bar: [fraud, embezzlement, perjury]
  party_founding_fee_cents: 100000
  max_platform_planks: 8
  initiative_signatures: 50
  exposure_halflife_sim_days: 14
  outlet_efficiency: 0.6
  abstain: {theta_0: 0.35, theta_conscientiousness: 0.15, theta_civic: 0.10}
  vote_model: fitted_from_deliberate
  vote_holdout_share: 0.20
  vote_min_holdout_lift: 0.5
  omega_prior: {congruence: 1.0, self_interest: 0.6, social: 0.4, media: 0.3, party_id: 0.8, incumbency: 0.2}
  llm_election_multiplier: 6.0
  can_regulate_feed: false
  policy:
    tax:
      income: {brackets: [[0, 0], [3000000, 2000], [9000000, 3500]]}
      corporate_bp: 2000
      capital_gains_bp: 1500
      inheritance_bp: 1000
      vat_bp: 1000
    money: {policy_rate_bp: 200}
    welfare:
      unemployment_benefit_cents: 120000
      benefit_duration_ticks: 8640
      pension_cents: 150000
      child_benefit_cents: 40000
    education: {spend_cents_per_student: 0, compulsory_until_age: 18}
    police: {budget_cents: 5000000}
    courts: {budget_cents: 3000000, loser_pays: false}
    prison: {capacity: 40}
    sentencing: {multiplier_bp: 10000}
    labour: {minimum_wage_cents: 1200, max_hours_per_sim_week: 48}
    regulation:
      finance: {margin_allowed: true, short_selling_allowed: true, insider_trading_enforced: true}
      labour: {at_will_dismissal: true}
      media: {disclosure_required: false}
      housing: {rent_cap_bp: null}
    migration: {quota_per_sim_year: 60}
    polity: {campaign_cap_cents: null, felon_franchise: false}
    government: {debt_ceiling_cents: 500000000, public_notices_budget_cents: 0}
    society: {feed_algorithm: engagement}
ablations:
  reflex_only: false
  obfuscate_domain: false
  disclose_simulation: false
  social_influence_off: false
  backfire_off: false
store:
  dsn: postgresql://polis_engine:polis@127.0.0.1:5432/polis
  reader_dsn: postgresql://polis_reader:polis_reader@127.0.0.1:5432/polis
  redis_url: redis://127.0.0.1:6379/0
  blob_url: file://./.blobs
telemetry:
  timing_sample_every: 25
  phase_budget_warn: true
  redis_publish: true
observatory:
  enabled: true
  bind: 127.0.0.1:8080
  static_dir: web/dist
