run:
  name: live-minimax-m3-pilot-1k
  seed: 2026072702
  ticks: 80
  checkpoint_interval: 20
  retention: full
  scale: 1000
  tags: [m1, calibration, live-provider, minimax-m3, bounded-pilot]
clock:
  profile: chronicle
  ticks_per_sim_day: 1
  days_per_sim_year: 360
  demographic_acceleration: 1.0
population:
  initial_agents: 1000
  age_distribution: pyramid_ca_2020
  trait_model: big_five_plus_econ
world:
  width: 200
  height: 200
  districts: 6
  places_per_district: 60
llm:
  est_tokens_per_call: 3300
  providers:
    reasoning:
      kind: minimax
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      max_concurrency: 8
      calls_per_window: 10000
      call_window_seconds: 18000
      quota_scope: minimax-token-plan
      timeout_s: 90
      max_retries: 5
      retry_base_seconds: 1
      retry_max_seconds: 30
      structured_output: none
      billing: token
      price_in_usd_per_mtok: 0.6
      price_out_usd_per_mtok: 2.4
      price_cached_in_usd_per_mtok: 0.12
      extra:
        reasoning_split: true
        render_schema: true
    stub:
      kind: stub
      max_concurrency: 32
      billing: free
  budget:
    lines:
      cognition: {calls_per_tick: 90, tokens_per_tick: 300000}
      ancillary: {calls_per_tick: 24, tokens_per_tick: 79200}
      external: {calls_per_tick: 0, tokens_per_tick: 0}
      free: {calls_per_tick: 512, tokens_per_tick: 1689600}
    usd_per_run: 25.0
    usd_halt_multiple: 1.0
    max_calls_per_run: 8000
    on_exhaustion: halt
  routing:
    DELIBERATE: {lane: reasoning, model: MiniMax-M3, temperature: 0.8, max_tokens: 512, structured: repair, template: deliberate/user.v1.jinja}
    REFLECT: {lane: reasoning, model: MiniMax-M3, temperature: 0.9, max_tokens: 512, structured: repair, template: reflect/questions.v1.jinja}
    CREDIT_EVAL: {lane: reasoning, model: MiniMax-M3, temperature: 0.2, max_tokens: 512, structured: repair, template: credit/eval.v1.jinja}
    IMPORTANCE: {lane: reasoning, model: MiniMax-M3, temperature: 0.0, max_tokens: 64, structured: repair, template: importance/user.v1.jinja}
    EMBED: {lane: stub, model: stub-embed-v1, temperature: 0.0, max_tokens: 64, structured: constrain, template: embedding/user.v1.jinja}
  fallback_policy: strict
  cache:
    mode: hybrid
    path: file://./.cache/live-minimax-m3-pilot
salience:
  policy: weighted
  deliberate_share: 0.07
  exploration_epsilon: 0.02
  cognition_sample_rate: 0.02
memory:
  write_threshold: 0.25
  max_per_agent: 3000
  retrieval_k: 12
  retrieval_max_tokens: 600
  reflection_threshold: 4.0
  reflection_min_gap_ticks: 24
mechanisms: {}
society:
  feed_algorithm: engagement
  outlets: 4
ablations:
  reflex_only: false
  obfuscate_domain: false
  disclose_simulation: false
store:
  dsn: postgresql://polis_engine:polis@127.0.0.1:5432/polis
  reader_dsn: postgresql://polis_reader:polis_reader@127.0.0.1:5432/polis
  redis_url: redis://127.0.0.1:6379/0
  blob_url: file://./.blobs
telemetry:
  timing_sample_every: 5
  phase_budget_warn: true
  redis_publish: false
observatory:
  enabled: false
  bind: 127.0.0.1:8080
